# =============================================================================
# Root Docker Compose — orchestrates the backend and frontend together (R29.3).
#
# All configuration is injected from the environment / a root `.env` file via
# ${VAR} interpolation (R29.4). Nothing privileged is hardcoded here — in
# particular the Supabase service-role key is only referenced by name and is
# supplied at `docker compose up` time (see .env.example).
#
# Each service is also independently deployable with its own Dockerfile and
# config (R29.10).
#
#   cp .env.example .env   # fill in real values, then:
#   docker compose up --build
# =============================================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Config comes from the environment / root .env (R29.4). The service-role
    # key is interpolated from the host — never a literal value in this file.
    environment: &backend-environment
      CHECKOUT_ENABLED: ${CHECKOUT_ENABLED:-false}
      STRIPE_MODE: ${STRIPE_MODE:-TEST}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_ACCOUNT_ID: ${STRIPE_ACCOUNT_ID:-}
      STRIPE_MERCHANT_COUNTRY: ${STRIPE_MERCHANT_COUNTRY:-}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-}
      STRIPE_PORTAL_CONFIGURATION_ID: ${STRIPE_PORTAL_CONFIGURATION_ID:-}
      BILLING_PLAN_TITLE: ${BILLING_PLAN_TITLE:-}
      BILLING_PLAN_FEATURES: ${BILLING_PLAN_FEATURES:-}
      BILLING_MEMBER_LIMIT: ${BILLING_MEMBER_LIMIT:-}
      BILLING_CURRENCY: ${BILLING_CURRENCY:-}
      BILLING_TAX_BEHAVIOR: ${BILLING_TAX_BEHAVIOR:-}
      BILLING_AUTOMATIC_TAX: ${BILLING_AUTOMATIC_TAX:-}
      BILLING_PAYMENT_METHODS: ${BILLING_PAYMENT_METHODS:-}
      BILLING_TERMS_URL: ${BILLING_TERMS_URL:-}
      BILLING_PRIVACY_URL: ${BILLING_PRIVACY_URL:-}
      BILLING_POLICY_URL: ${BILLING_POLICY_URL:-}
      BILLING_TAX_DISCLOSURE: ${BILLING_TAX_DISCLOSURE:-}
      BILLING_APPROVAL_REFERENCE: ${BILLING_APPROVAL_REFERENCE:-}
      BILLING_EVENT_RETENTION_DAYS: ${BILLING_EVENT_RETENTION_DAYS:-}
      BILLING_MAX_RETRIES: ${BILLING_MAX_RETRIES:-10}
      SELF_SERVICE_SIGNUP_ENABLED: ${SELF_SERVICE_SIGNUP_ENABLED:-false}
      BILLING_AVAILABLE: ${BILLING_AVAILABLE:-false}
      MEMBER_VIEWS_ENABLED: ${MEMBER_VIEWS_ENABLED:-false}
      MEMBERSHIP_ACCESS_ENABLED: ${MEMBERSHIP_ACCESS_ENABLED:-false}
      ACCESS_EMAIL_DELIVERY_URL: ${ACCESS_EMAIL_DELIVERY_URL:-}
      ACCESS_EMAIL_DELIVERY_TOKEN: ${ACCESS_EMAIL_DELIVERY_TOKEN:-}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      PORT: 8080
      NODE_ENV: production
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY}
      CORS_ORIGIN: ${CORS_ORIGIN}
    ports:
      - "8080:8080"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  billing-worker:
    profiles: [billing]
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment: *backend-environment
    command: ["node", "dist/billing-worker.js"]
    healthcheck:
      disable: true
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # VITE_* are build-time (R29.7); interpolated from env, baked into bundle.
      # Only public values — the secret key is never passed here (R29.4).
      args:
        VITE_EMAIL_OTP_ENABLED: ${VITE_EMAIL_OTP_ENABLED:-false}
        VITE_AUTH_CAPTCHA_SITE_KEY: ${VITE_AUTH_CAPTCHA_SITE_KEY:-}
        VITE_API_URL: ${VITE_API_URL}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
    ports:
      - "5173:8080"
    depends_on:
      - backend          # R29.3
    restart: unless-stopped
