# =============================================================================
# nginx server config for the built SPA.
#
# Serves the static Vite bundle on port 8080 (a non-privileged port, so nginx
# can run as the unprivileged `nginx` user — R29.2) and falls back to
# index.html for client-side routes (React Router), per the SPA requirement.
# =============================================================================
server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # gzip for text-based assets (optional, improves transfer size).
    gzip               on;
    gzip_vary          on;
    gzip_min_length    1024;
    gzip_proxied       any;
    gzip_types         text/plain text/css application/javascript application/json image/svg+xml;

    # Hashed static assets can be cached aggressively and immutably.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA fallback: unknown paths resolve to index.html so client-side
    # routing (deep links, refresh on a route) works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the HTML entrypoint so new deploys are picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
